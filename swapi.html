<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Star Wars Database</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>⭐ Star Wars Database</h1>

</header>

<main>

  <section id="categories" class="grid">

    <div class="card category" data-category="films">
      <h2>🎬 Films</h2>
    </div>

    <div class="card category" data-category="people">
      <h2>👤 People</h2>
    </div>

    <div class="card category" data-category="planets">
      <h2>🪐 Planets</h2>
    </div>

    <div class="card category" data-category="species">
      <h2>🧬 Species</h2>
    </div>

    <div class="card category" data-category="vehicles">
      <h2>🚗 Vehicles</h2>
    </div>

    <div class="card category" data-category="starships">
      <h2>🚀 Starships</h2>
    </div>

  </section>

  <section id="results"></section>

</main>

<script src="script.js"></script>

</body>
</html>
